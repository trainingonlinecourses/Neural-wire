\" npx playwright test --reporter=line", "Bash=BASE=\"https://neural-wire-nine.vercel.app\"\nfor p in \\\n  /api/alerts \\\n  /api/breakthrough \\\n  /api/capability-matrix \\\n  /api/collections \\\n  /api/feed-health \\\n  /api/feed \\\n  /api/feeds/anthropic \\\n  /api/github/trending \\\n  /api/leaderboard \\\n  /api/models/live \\\n  /api/news \\\n  /api/news/refresh \\\n  /api/notes \\\n  /api/papers \\\n  /api/prefs \\\n  /api/prefs/theme \\\n  /api/pulse \\\n  /api/sentiment \\\n  /api/stories \\\n  /api/story-graph \\\n  /api/timeline \\\n  /api/watchlist \\\n  /api/watchlist/movers \\\n  /api/cron/ingest ; do\n  code=$(curl -s -o /dev/null -w \"%{http_code}\" \"$BASE$p\")\n  echo \"$code  GET $p\"\ndone", "Bash=cd \"$(pwd)\"\n# Extract all source ids+urls and probe each RSS/rss kind URL\nnode -e '\nconst fs = require(\"fs\");\nconst src = fs.readFileSync(\"src/lib/sources.ts\",\"utf8\");\nconst re = /id:\\x27([^\\x27]+)\\x27[^}]*?url:\\s*(\\x27[^\\x27]+\\x27|null)/g;\nlet m, out=[];\nwhile((m=re.exec(src))){ out.push([m[1], m[2]===\"null\"?\"\":m[2].slice(1,-1)]); }\nconsole.log(JSON.stringify(out));\n' > /tmp/feeds.json\nwc -l < /tmp/feeds.json\ncat /tmp/feeds.json | head -c 300", "Bash=cd \"$(pwd)\"\n# Probe each feed URL (HEAD-ish GET, short timeout). Only test non-empty URLs.\nnode -e '\nconst fs=require(\"fs\");\nconst list=JSON.parse(fs.readFileSync(\"/tmp/feeds.json\",\"utf8\"));\nconst urls=list.filter(x=>x[1]);\nfs.writeFileSync(\"/tmp/urlmap.json\", JSON.stringify(urls));\nconsole.log(\"total feeds with url:\", urls.length);\n'\n# Use curl in parallel-ish loop, capture status per id\nwhile IFS= read -r line; do\n  id=$(echo \"$line\" | cut -d'|' -f1)\n  url=$(echo \"$line\" | cut -d'|' -f2)\n  code=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 12 -A \"Mozilla/5.0\" \"$url\")\n  echo \"$code  $id  $url\"\ndone < <(node -e 'const u=require(\"/tmp/urlmap.json\");u.forEach(x=>console.log(x[0]+\"|\"+x[1]))')", "Bash=cd \"$(pwd)\"\nmkdir -p .tm