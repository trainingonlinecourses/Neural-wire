mitted version? ===\"\ngit show HEAD:src/lib/sources.ts | grep -cE \"id:'kaggle'|id:'synced'|id:'ai-news'\"", "Bash=cd \"$(pwd)\"\necho \"=== current synced entries ===\"\ngrep -n \"id:'synced'\" src/lib/sources.ts\necho \"=== current kaggle entries ===\"\ngrep -n \"id:'kaggle'\" src/lib/sources.ts\necho \"=== current ai-news entries ===\"\ngrep -n \"id:'ai-news'\" src/lib/sources.ts", "Bash=cd \"$(pwd)\"\necho \"=== duplicate ids (should be empty) ===\"\ngrep -oE \"id:'[^']+'\" src/lib/sources.ts | sort | uniq -d\necho \"=== exit code: $? ===\"\necho \"=== build ===\"\nnpm run build 2>&1 | tail -15", "Bash=cd \"$(pwd)\"\necho \"=== unit tests ===\"\nnpm test 2>&1 | tail -8\necho \"=== live API: previously-broken feeds should no longer 502 ===\"\nfor id in anthropic anthropic-safety ai2 fair google-brain databricks wandb-blog berkeley-bair cmu-ml character-ai inflection eleutherai; do\n  code=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 35 -X POST \"https://neural-wire-nine.vercel.app/api/feeds/$id\")\n  echo \"$code  POST /api/feeds/$id\"\ndone", "Bash=cd \"$(pwd)\"\ngit add src/lib/sources.ts && git commit -m \"fix: replace dead RSS feed URLs and remove duplicate source ids\" && vercel --prod --yes 2>&1 | tail -15", "Bash=cd \"$(pwd)\"\necho \"=== wait for deploy + re-verify live API (new build URL) ===\"\nsleep 20\nBASE=\"https://neural-wire-99y5fhm5s-trainingonlinecourses-projects.vercel.app\"\nfor id in anthropic anthropic-safety ai2 fair google-brain databricks wandb-blog berkeley-bair cmu-ml character-ai inflection eleutherai; do\n  code=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 35 -X POST \"$BASE/api/feeds/$id\")\n  echo \"$code  POST /api/feeds/$id\"\ndone", "Bash=cd \"$(pwd)\"\nBASE=\"https://neural-wire-99y5fhm5s-trainingonlinecourses-projects.vercel.app\"\nfor id in anthropic databricks wandb-blog berkeley-bair; do\n  echo \"=== $id ===\"\n  curl -s -L --max-time 35 -X POST \"$BASE/api/feeds/$id\" -w \"\\nFINAL HTTP %{http_code}\\n\"\ndone", "Bash=cd \"$(pwd)\"\nBASE=\"https://neural-wire-99y5fhm5s-trainingonlinecourses-projects.vercel.app\"\necho \"=== anthropic: full headers, no -L ===\"\ncurl -s -D - -o /dev/null --max-time 35 -X POST \"$BASE/api/feeds/anthropic\" | head -20", "Bash=cd \"$(pwd)\"\necho \"=== nine alias now ===\"\ncurl -s -o /dev/null -w \"GET /: %{http_code}\\n\" --max-time 15 \"https://neural-wire-nine.vercel.app/\"\ncurl -s -o /dev/null -w \"POST /api/feeds/anthropic: %{http_code}\\n\" --max-time 35 -X POST \"https://neural-wire-nine.vercel.app/api/feeds/anthropic\"\necho \"=== compare deploy metadata for both URLs ===\"\necho \"-- nine --\"; curl -s -D - -o /dev/null --max-time 15 \"https://neural-wire-nine.vercel.app/\" | grep -i \"x-vercel-id\"\necho \"-- new --\"; curl -s -D - -o /dev/null --max-time 15 \"https://neural-wire-99y5fhm5s-trainingonlinecourses-projects.vercel.app/\" | grep -i \"x-vercel-id\"", "Bash=cd \"$(pwd)\"\nBASE=\"https://neural-wire-nine.vercel.app\"\necho \"=== re-verify all previously-broken feeds (expect 200, not 502) ===\"\nfor id in anthropic anthropic-safety ai2 fair google-brain databricks wandb-blog berkeley-bair cmu-ml character-ai inflection eleutherai; do\n  code=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 35 -X POST \"$BASE/api/feeds/$id\")\n  echo \"$code  POST /api/feeds/$id\"\ndone\necho \"=== also re-run live smoke playwright ===\"\nPLAYWRIGHT_BROWSERS_PATH=\"$(pwd)/.playwright-browsers\" npx playwright test tests/e2e/live-smoke.spec.ts --reporter=line", "Bash=cd \"$(pwd)\"\nBASE=\"https://neural-wire-nine.vercel.app\"\nfor id in ai2 fair wandb-blog; do\n  echo \"=== $id ===\"\n  curl -s --max-time 35 -X POST \"$BASE/api/feeds/$id\" -w \"\\nHTTP %{http_code}\\n\"\ndone", "Bash=cd \"$(pwd)\"\necho \"=== test direct fetch from Node (simulates server) for the 3 failing URLs ===\"\nnode -e '\nconst urls = {\n  ai2: \"https://www.allenai.org/blog/rss.xml\",\n  fair: \"https://research.facebook.com/blog/rss/\",\n  wandb: \"https://wandb.ai/feed.xml\"\n};\n(async () => {\n  for (const [k,u] of Object.entries(urls)) {\n    try {\n      const res = await fetch(u, { redirect:\"follow\", headers:{ \"User-Agent\":\"NeuralWire/2.3 (+https://neuralwire.app) FeedFetcher/1.0\", \"Accept\":\"application/rss+xml, application/xml, application/atom+xml, text/xml, */*\" } });\n      const txt = await res.text();\n      console.log(k, res.status, \"len=\", txt.length, \"head=\", JSON.stringify(txt.slice(0,80)));\n    } catch(e) { console.log(k, \"ERR\", e.message); }\n  }\n})();\n'", "Bash=cd \"$(pwd)\"\nprobe() { curl -s -o /dev/null -w \"%{http_code}\" --max-time 8 -A \"Mozilla/5.0\" \"$1\"; }\necho \"=== ai2 / allenai real feeds ===\"\nfor u in \"https://allenai.org/blog/rss.xml\" \"https://www.allenai.org/blog/rss\" \"https://allenai.org/feed.xml\"; do echo \"$(probe \"$u\")  $u\"; done\necho \"=== fair/meta real feeds ===\"\nfor u in \"https://ai.meta.com/blog/rss.xml\" \"https://about.fb.com/news/feed/\" \"https://research.facebook.com/blog/rss.xml\"; do echo \"$(probe \"$u\")  $u\"; done\necho \"=== wandb real feeds ===\"\nfor u in \"https://wandb.ai/site/feed\" \"https://wandb.ai/blog/rss\" \"https://www.wandb.co/blog/rss.xml\"; do echo \"$(probe \"$u\")  $u\"; done\necho \"=== google-news fallback for all 3 (validated earlier pattern) ===\"\nfor q in \"allenai.org\" \"research.facebook.com\" \"wandb.ai\"; do\n  u=\"https://news.google.com/rss/search?q=site:$q&hl=en-US&gl=US&ceid=US:en\"\n  echo \"$(probe \"$u\")  $u\"\ndone", "Bash=cd \"$(pwd)\"\necho \"=== check if about.fb.com/news/feed/ is real RSS ===\"\ncurl -s --max-time 10 -A \"Mozilla/5.0\" \"https://about.fb.com/news/feed/\" | head -c 200\necho \"\"\necho \"=== node fetch check for the candidate URLs (does it return XML?) ===\"\nnode -e '\nconst urls = {\n  \"fb-news\": \"https://about.fb.com/news/feed/\",\n  \"gn-ai2\": \"https://news.google.com/rss/search?q=site:allenai.org&hl=en-US&gl=US&ceid=US:en\",\n  \"gn-wandb\": \"https://news.google.com/rss/search?q=site:wandb.ai&hl=en-US&gl=US&ceid=US:en\"\n};\n(async () => {\n  for (const [k,u] of Object.entries(urls)) {\n    try {\n      const res = await fetch(u, { redirect:\"follow\", headers:{ \"User-Agent\":\"NeuralWire/2.3 FeedFetcher/1.0\", \"Accept\":\"application/rss+xml, application/xml, application/atom+xml, text/xml, */*\" } });\n      const txt = await res.text();\n      console.log(k, res.status, \"len=\", txt.length, \"isXML=\", txt.trim().startsWith(\"<\"));\n    } catch(e){ console.log(k,\"ERR\",e.message); }\n  }\n})();\n'", "Bash=cd \"$(pwd)\"\nnpm run build 2>&1 | tail -3\ngit add src/lib/sources.ts && git commit -m \"fix: correct ai2/fair/wandb feed URLs to valid RSS sources\" && vercel --prod --yes 2>&1 | tail -4", "Bash=cd \"$(pwd)\"\nsleep 20\nBASE=\"https://neural-wire-nine.vercel.app\"\necho \"=== final re-verify of all 12 previously-broken feeds (expect 200) ===\"\nfor id in anthropic anthropic-safety ai2 fair google-brain databricks wandb-blog berkeley-bair cmu-ml character-ai inflection eleutherai; do\n  code=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 35 -X POST \"$BASE/api/feeds/$id\")\n  echo \"$code  POST /api/feeds/$id\"\ndone", "Bash=cd \"$(pwd)\"\necho \"=== remove temp audit scratch ===\"\nrm -rf .tmp-audit\necho \"=== git status ===\"\ngit status --short", "Bash=cd \"$(pwd)\"\necho \"=== live API: all 12 fixed feeds (expect 200) ===\"\nBASE=\"https://neural-wire-nine.vercel.app\"\nfail=0\nfor id in anthropic anthropic-safety ai2 fair google-brain databricks wandb-blog berkeley-bair cmu-ml character-ai inflection eleutherai; do\n  code=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 35 -X POST \"$BASE/api/feeds/$id\")\n  [ \"$code\" != \"200\" ] && fail=$((fail+1))\n  echo \"$code  POST /api/feeds/$id\"\ndone\necho \"FAILURES=$fail\"", "Bash=cd \"$(pwd)\"\necho \"=== live API spot-check (3 of the fixed feeds + cron auth) ===\"\nBASE=\"https://neural-wire-nine.vercel.app\"\nfor id in anthropic fair wan